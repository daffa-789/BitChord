# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
compose.desktop.packaging.checkJdkVendor=false
# This machine's JVM times out resolving repos over IPv6; force IPv4 for downloads.
systemProp.java.net.preferIPv4Stack=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# The JDK is picked up from JAVA_HOME (JDK 21) or from a toolchain, so no machine-specific
# org.gradle.java.home lives here — that path would not exist on another box or in CI. Set it in
# ~/.gradle/gradle.properties if this machine needs to pin one.
