# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
# Three modules, one host: build them concurrently and reuse task outputs across the Windows and
# Linux target builds instead of re-running them.
org.gradle.parallel=true
org.gradle.caching=true
compose.desktop.packaging.checkJdkVendor=false
# This machine's JVM times out resolving repos over IPv6; force IPv4 for downloads.
systemProp.java.net.preferIPv4Stack=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# The JDK is picked up from JAVA_HOME (JDK 21) or from a toolchain, so no machine-specific
# org.gradle.java.home lives here — that path would not exist on another box or in CI. Set it in
# ~/.gradle/gradle.properties if this machine needs to pin one.

# Shared library versions, read by every module that needs them.
#
# They live here rather than in each build script because the modules used to drift: :shared built
# against ktor 3.5.2 while :desktopApp pinned 3.0.3, and Gradle resolved the union onto one classpath.
# That is the same fault that once made lyrics crash on a Windows desktop (see CMP_DESKTOP in
# desktopUi/build.gradle.kts): code compiled against one version, running against another.
bitchord.lib.ktor=3.5.2
bitchord.lib.coroutines=1.11.0
bitchord.lib.serialization=1.11.0
bitchord.lib.jsoup=1.22.2
bitchord.lib.innertubex=v0.7.0
bitchord.lib.newpipe=v0.26.3
bitchord.lib.coil=3.0.4
bitchord.lib.sqliteJdbc=3.47.1.0
bitchord.lib.jna=5.19.1

# Per-target Compose and Haze. Haze 1.7.x is tied to the Compose it was compiled against, and the
# Windows packages stay on the plugin's own 1.10.3 while Linux moves to 1.12.0; both modules read the
# pair from here so a cross build (`-Pbitchord.target=linux`) cannot mix the two.
bitchord.lib.compose.windows=1.10.3
bitchord.lib.compose.linux=1.12.0
bitchord.lib.haze.windows=1.7.2
bitchord.lib.haze.linux=1.7.3
bitchord.lib.material3=1.9.0
bitchord.lib.materialIcons=1.7.3
