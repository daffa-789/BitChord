name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop Build & Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin Desktop
        run: .\gradlew.bat :desktopApp:compileKotlin

      - name: Run desktop tests
        run: .\gradlew.bat :desktopApp:test

      # The shared layer is what the phone and the desktop both compile against, and
      # its own suite never ran here before — so a purge on one side could go unnoticed.
      - name: Run shared tests
        run: .\gradlew.bat :shared:jvmTest

  desktop-macos:
    name: Desktop Build (macOS target)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # The DMG is only packaged in Release, which no tag has triggered yet; compiling on the Mac image
      # is what keeps the macOS branches from drifting out of build between releases.
      - name: Compile Kotlin Desktop for macOS
        run: ./gradlew :desktopApp:compileKotlin

  desktop-linux:
    name: Desktop Build (Linux target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # The same sources, asked for Linux artefacts: this is what keeps the MPRIS, tray and
      # audio-watcher code from drifting out of build.
      - name: Compile Kotlin Desktop for Linux
        run: ./gradlew :desktopApp:compileKotlin

  android:
    name: Android Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # AGP would otherwise download its default NDK revision during configuration, and that download
      # fails here with a corrupt archive. Whatever the image already ships is used instead.
      - name: Find the preinstalled NDK
        id: ndk
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?no Android SDK on this runner}}"
          ndk="$(ls "$sdk/ndk" 2>/dev/null | sort -V | tail -1)"
          if [ -z "$ndk" ]; then
            echo "::error::this runner image carries no NDK under $sdk/ndk"
            exit 1
          fi
          echo "Using NDK $ndk"
          echo "version=$ndk" >> "$GITHUB_OUTPUT"

      - name: Assemble Android Debug APK
        run: ./gradlew :app:assembleDebug -Pbitchord.ndkVersion=${{ steps.ndk.outputs.version }}
